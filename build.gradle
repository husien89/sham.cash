buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
android {
    // ... إعداداتك الأخرى هنا ...

    // ✅ إعداد تقارير الفحص
    lintOptions {
        textReport project.hasProperty('isCI')
        textOutput 'stdout'
    }
}
