<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شام كاش - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: #fff;
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .logo p {
            color: #888;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #444;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: 'Tajawal', sans-serif;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: red;
            display: none;
            background: #ffebeb;
            padding: 10px;
            border-radius: 8px;
        }
        .message.success {
            color: #2e7d32;
            background: #e8f5e9;
        }
        .hint {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #999;
            background: #f8f8f8;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>شام كاش</h1>
            <p>المنصة الآمنة للدفع الإلكتروني</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" required placeholder="أدخل اسم المستخدم" autocomplete="username">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور" autocomplete="current-password">
            </div>
            <button type="submit" id="loginBtn">تسجيل الدخول</button>
            <div id="errorMessage" class="message"></div>
        </form>
        <div class="hint">
            للتجربة:<br>
            المستخدم: <b>admin</b> | كلمة المرور: <b>123456</b>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // إذا كان مسجل دخول من قبل، روح مباشرة على الداشبورد
        if (localStorage.getItem('sham_logged') === 'true') {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('errorMessage');
            const btn = document.getElementById('loginBtn');

            // 1. تأكد إنو auth.js تحمل صح
            if (typeof login !== 'function') {
                errorBox.textContent = 'خطأ: ملف auth.js مو محمّل صح، تأكد إنو جنب login.html';
                errorBox.className = 'message';
                errorBox.style.display = 'block';
                return;
            }

            if (!username || !password) {
                errorBox.textContent = 'عبي اسم المستخدم وكلمة المرور';
                errorBox.className = 'message';
                errorBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'جاري الدخول...';

            const result = login(username, password);

            if (result.success) {
                errorBox.textContent = 'تم الدخول بنجاح، جاري التحويل...';
                errorBox.className = 'message success';
                errorBox.style.display = 'block';
                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 500);
            } else {
                errorBox.textContent = result.message;
                errorBox.className = 'message';
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'تسجيل الدخول';
            }
        });
    </script>
</body>
</html>
