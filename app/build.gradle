هplugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.husien.shamcash'
    compileSdk 34

    defaultConfig {
        applicationId "com.husien.shamcash"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
}
classpath 'com.google.gms:google-services:4.4.0' // استخدم أحدث إصدار
apply plugin: 'com.google.gms.google-services'
dependencies {
    // AndroidX & Jetpack
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    // ... يمكنك إضافة مكتبات Jetpack أخرى حسب الحاجة

    // Google Tink (للتشفير)
    implementation 'com.google.crypto.tink:tink-android:1.17.0'
    
    // Google Mobile Services (GMS) - تُضاف عادةً تلقائيًا مع Firebase
    // implementation 'com.google.android.gms:play-services-base:18.5.0'
}
// مكتبات Android Jetpack و AndroidX
implementation 'androidx.appcompat:appcompat:1.7.0'
implementation 'androidx.datastore:datastore-preferences:1.1.1'
implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

// مكتبة Google Tink للتشفير
implementation 'com.google.crypto.tink:tink-android:1.15.0'
// Firebase BoM
implementation platform('com.google.firebase:firebase-bom:35.2.0')

// Firebase الأساسية
implementation 'com.google.firebase:firebase-analytics'

// اختر المكتبات التي تحتاجها فقط:

// المصادقة
implementation 'com.google.firebase:firebase-auth'

// Firestore قاعدة البيانات
implementation 'com.google.firebase:firebase-firestore'

// Realtime Database
implementation 'com.google.firebase:firebase-database'

// تخزين الملفات
implementation 'com.google.firebase:firebase-storage'

// الإشعارات
implementation 'com.google.firebase:firebase-messaging'

// Crashlytics
implementation 'com.google.firebase:firebase-crashlytics'

// Remote Config
implementation 'com.google.firebase:firebase-config'

// In-App Messaging
implementation 'com.google.firebase:firebase-inappmessaging'
