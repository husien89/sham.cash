name: Build Sham.Cash APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # يسمح بالبناء يدوياً من خلال زر

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: استخراج الكود
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: منح صلاحيات التنفيذ
        run: chmod +x gradlew

      - name: بناء ملف APK
        run: ./gradlew assembleDebug

      - name: رفع ملف APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: sham.cash-apk
          path: app/build/outputs/apk/debug/app-debug.apk
