name: Build Sham.Cash APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: استخراج الكود
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: التحقق من وجود ملف gradlew وإنشائه إن لم يكن موجوداً
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Creating gradlew..."
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradlew -o gradlew
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradlew.bat -o gradlew.bat
          fi

      - name: منح صلاحيات التنفيذ
        run: chmod +x gradlew

      - name: بناء ملف APK
        run: ./gradlew assembleDebug --stacktrace

      - name: التحقق من وجود ملف APK
        run: ls -la app/build/outputs/apk/debug/

      - name: رفع ملف APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: sham.cash-apk
          path: app/build/outputs/apk/debug/app-debug.apk

